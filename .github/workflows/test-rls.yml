name: RLS integration tests

on:
  pull_request:
    branches: [main, owner]
    paths:
      - "supabase/migrations/**"
      - "tests/rls/**"
      - "scripts/apply-test-migrations.mjs"
      - "package.json"
      - "vitest.config.ts"
  push:
    branches: [main]

jobs:
  rls:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Write .env.test
        env:
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
        run: |
          if [ -z "${TEST_DATABASE_URL}" ]; then
            echo "TEST_DATABASE_URL secret is missing"
            exit 1
          fi
          echo "TEST_DATABASE_URL=${TEST_DATABASE_URL}" > .env.test

      - name: Run RLS tests
        run: npm run test:rls
